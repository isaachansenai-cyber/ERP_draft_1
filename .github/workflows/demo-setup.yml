# Set up the hosted DEMO project: switch the freshly migrated, empty database to
# demo mode, import the source master, demo seed and history, and create the 10
# demo logins. MANUAL ONLY, demo environment only. The scripts refuse unless the
# project ref is in DEMO_PROJECT_REF_ALLOWLIST and the database is (or becomes)
# demo mode, so this can never run against the pilot.
#
# The demo project's URL and ref are public and set below. Repository (or
# "demo" environment) secrets needed:
#   DEMO_DATABASE_URL               Session pooler URI including the password
#   DEMO_SUPABASE_SERVICE_ROLE_KEY  service-role (secret) key of the DEMO project
#   DEMO_CREDENTIALS_PASSPHRASE     any passphrase you choose, to encrypt the demo passwords
# The generated demo passwords never appear in logs: they are encrypted with the
# passphrase and uploaded as a 1-day artifact (decrypt instructions in docs/demo/README.md).
name: Demo project setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: demo
    env:
      SUPABASE_URL: https://qfvtpgxguaftrprxprof.supabase.co
      DEMO_PROJECT_REF_ALLOWLIST: qfvtpgxguaftrprxprof
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Which demo settings are visible (yes/no only, never values)
        env:
          S_DB: ${{ secrets.DEMO_DATABASE_URL != '' }}
          S_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY != '' }}
          S_PASS: ${{ secrets.DEMO_CREDENTIALS_PASSPHRASE != '' }}
          V_DB: ${{ vars.DEMO_DATABASE_URL != '' }}
          V_KEY: ${{ vars.DEMO_SUPABASE_SERVICE_ROLE_KEY != '' }}
          V_PASS: ${{ vars.DEMO_CREDENTIALS_PASSPHRASE != '' }}
        run: |
          echo "secret DEMO_DATABASE_URL: $S_DB | as variable instead: $V_DB"
          echo "secret DEMO_SUPABASE_SERVICE_ROLE_KEY: $S_KEY | as variable instead: $V_KEY"
          echo "secret DEMO_CREDENTIALS_PASSPHRASE: $S_PASS | as variable instead: $V_PASS"
      - name: Prepare the connection (TLS on; the pooler certificate chain is Supabase's own CA)
        env:
          RAW_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          # Trim whitespace and surrounding quotes that often come with a pasted value.
          url=$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//")
          echo "::add-mask::$url"
          # Diagnose without printing the value: only its shape, host and username format.
          node -e '
            const raw = process.argv[1] || "";
            if (!raw) { console.log("DEMO_DATABASE_URL is empty or not visible to this workflow (check the secret name and that it is a repository or demo-environment secret)."); process.exit(1); }
            let u; try { u = new URL(raw); } catch { console.log("DEMO_DATABASE_URL is not a URL. It must start with postgresql://"); process.exit(1); }
            const ok = /^postgres(ql)?:$/.test(u.protocol);
            console.log(JSON.stringify({ scheme: u.protocol, host: u.hostname, port: u.port, database: u.pathname,
              username_format: /^postgres\.[a-z0-9]{20}$/.test(decodeURIComponent(u.username)) ? "postgres.<ref>" : (u.username ? "other" : "missing"),
              password_present: Boolean(u.password), placeholder_left_in: /YOUR-PASSWORD|%5BYOUR/i.test(raw) }));
            if (!ok || !u.hostname || !u.password) process.exit(1);
          ' "$url"
          case "$url" in *sslmode=*) ;; *\?*) url="$url&sslmode=no-verify" ;; *) url="$url?sslmode=no-verify" ;; esac
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Current data mode
        id: mode
        run: |
          mode=$(node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query('select data_mode from public.app_settings');console.log(r.rows[0].data_mode);await c.end()})().catch(e=>{console.error(e.message);process.exit(1)})")
          echo "data_mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Switch the empty database to demo mode
        if: steps.mode.outputs.mode == 'pilot'
        run: npx tsx scripts/demo/init-demo-database.ts
      - name: Import source master, demo seed and history (idempotent)
        run: npm run import:demo
      - name: Create or re-key the demo logins
        run: npm run demo:users
        env:
          DEMO_CREDENTIALS_PATH: ${{ runner.temp }}/DEMO_CREDENTIALS.local.md
      - name: Encrypt the credentials file
        env:
          PASSPHRASE: ${{ secrets.DEMO_CREDENTIALS_PASSPHRASE }}
        run: |
          test -n "$PASSPHRASE" || { echo "DEMO_CREDENTIALS_PASSPHRASE is not set"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE \
            -in "$RUNNER_TEMP/DEMO_CREDENTIALS.local.md" -out "$RUNNER_TEMP/demo-credentials.md.enc"
          shred -u "$RUNNER_TEMP/DEMO_CREDENTIALS.local.md"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-credentials-encrypted
          path: ${{ runner.temp }}/demo-credentials.md.enc
          retention-days: 1
